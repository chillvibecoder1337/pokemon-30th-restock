name: Test ntfy

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send fictional restock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC secret is missing"
            exit 1
          fi
          curl -sfS \
            -H "Title: Restock: TEST 30th Celebration ETB" \
            -H "Priority: high" \
            -H "Tags: bell,shopping" \
            -H "Click: https://www.truecollector.pl/pokemon-30th-celebration-c-1_77.html" \
            --data-binary $'TRUECOLLECTOR — TEST restock (fictief)\n1 in stock\nhttps://www.truecollector.pl/pokemon-30th-celebration-c-1_77.html\n\nDit is een testding van restock30pkmn checker. Geen echte voorraad.' \
            "https://ntfy.sh/${NTFY_TOPIC}"
          echo "Test notification sent"
