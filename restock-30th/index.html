<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>restock30pkmn checker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #111318;
        --card: #1c1f27;
        --text: #f4f1ea;
        --muted: #9aa3b2;
        --line: #2a2f3a;
        --in: #3d9a6a;
        --out: #b4534a;
        --btn: #e8c36a;
        --btn-text: #1a1408;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.45;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1.25rem 1rem 3rem;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.35rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
      }
      button,
      a.btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1rem;
        font-weight: 650;
        text-decoration: none;
        color: var(--btn-text);
        background: var(--btn);
        cursor: pointer;
        display: inline-block;
      }
      a.btn.secondary,
      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 0.95rem 1rem;
        margin-bottom: 0.75rem;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        align-items: flex-start;
      }
      .shop {
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .name {
        font-weight: 650;
        margin: 0.15rem 0 0.35rem;
      }
      .note {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .badge {
        flex: none;
        font-size: 0.75rem;
        font-weight: 700;
        border-radius: 999px;
        padding: 0.25rem 0.55rem;
      }
      .badge.in {
        background: color-mix(in srgb, var(--in) 25%, transparent);
        color: #8ee0b0;
      }
      .badge.out {
        background: color-mix(in srgb, var(--out) 25%, transparent);
        color: #f0a8a2;
      }
      .error {
        color: #f0a8a2;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>restock30pkmn checker</h1>
      <p class="meta" id="checked">Loading status…</p>
      <div class="actions">
        <button type="button" id="open-all">Open all in stock</button>
        <button type="button" class="secondary" id="check-now">Check now</button>
        <a class="btn secondary" href="https://ntfy.sh/cardorca-30th-8lwo57sz9g1ikd0b">Subscribe</a>
      </div>
      <div id="list"></div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
